name: APKS Rebuild and Sign

on:
  workflow_dispatch:
    inputs:
      apks_url:
        description: "Direct APKS download URL (leave empty to use original.apks from repo)"
        required: false
        default: ""

  push:
    branches:
      - main
    paths:
      - "original.apks"

jobs:
  rebuild-apks:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # Java 17
      # ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ─────────────────────────────────────────────────────────────
      # Android SDK / Build Tools
      # ─────────────────────────────────────────────────────────────
      - name: Install Android SDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
            -O cmdline.zip

          unzip -q cmdline.zip -d cmdline-tools

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          mv cmdline-tools/cmdline-tools/* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # ─────────────────────────────────────────────────────────────
      # Apktool
      # ─────────────────────────────────────────────────────────────
      - name: Install apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.1/apktool_3.0.1.jar \
            -O apktool.jar

          sudo mv apktool.jar /usr/local/bin/apktool.jar

          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null

          sudo chmod +x /usr/local/bin/apktool

          apktool --version

      # ─────────────────────────────────────────────────────────────
      # Prepare APKS
      # ─────────────────────────────────────────────────────────────
      - name: Prepare input APKS
        env:
          APKS_URL: ${{ github.event.inputs.apks_url }}
        run: |
          if [ -n "$APKS_URL" ]; then
            echo "Downloading APKS from URL..."
            curl -L --fail "$APKS_URL" -o original.apks
          else
            echo "Using original.apks from repository."

            if [ ! -f original.apks ]; then
              echo "::error::original.apks not found."
              exit 1
            fi
          fi

          echo "Input:"
          ls -lh original.apks

      # ─────────────────────────────────────────────────────────────
      # Extract APKS
      # ─────────────────────────────────────────────────────────────
      - name: Extract APKS
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q original.apks -d extracted

          echo "Extracted files:"
          find extracted -type f -name "*.apk" -print

      # ─────────────────────────────────────────────────────────────
      # Validate split set
      # ─────────────────────────────────────────────────────────────
      - name: Validate APK set
        run: |
          APK_COUNT=$(find extracted -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found inside original.apks"
            exit 1
          fi

          echo "Found $APK_COUNT APK files."

          find extracted -type f -name "*.apk" -print

      # ─────────────────────────────────────────────────────────────
      # Identify base APK
      # ─────────────────────────────────────────────────────────────
      - name: Identify base APK
        run: |
          BASE_APK=$(find extracted -maxdepth 1 -type f -name "*.apk" \
            ! -name "*config*" \
            | head -n 1)

          if [ -z "$BASE_APK" ]; then
            echo "::error::Could not identify base APK."
            exit 1
          fi

          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"

          echo "Base APK:"
          echo "$BASE_APK"

      # ─────────────────────────────────────────────────────────────
      # Decode base APK
      #
      # Only the base APK is decoded/rebuilt here.
      # Configuration splits are preserved as-is.
      # ─────────────────────────────────────────────────────────────
      - name: Decode base APK
        run: |
          rm -rf decoded

          apktool d \
            "$BASE_APK" \
            -f \
            -o decoded

      # ─────────────────────────────────────────────────────────────
      # Example safe modification point
      #
      # Add your own authorized application changes here.
      # ─────────────────────────────────────────────────────────────
      - name: Show decoded application
        run: |
          echo "Decoded application:"
          ls -lah decoded

          echo
          echo "Manifest:"
          sed -n '1,120p' decoded/AndroidManifest.xml

      # ─────────────────────────────────────────────────────────────
      # Rebuild base APK
      # ─────────────────────────────────────────────────────────────
      - name: Rebuild base APK
        run: |
          apktool b \
            decoded \
            -o rebuilt-base-unsigned.apk

          ls -lh rebuilt-base-unsigned.apk

      # ─────────────────────────────────────────────────────────────
      # Align base APK
      # ─────────────────────────────────────────────────────────────
      - name: Align base APK
        run: |
          zipalign \
            -f \
            -p \
            4 \
            rebuilt-base-unsigned.apk \
            rebuilt-base-aligned.apk

          zipalign -c -P 4 -v 4 rebuilt-base-aligned.apk

      # ─────────────────────────────────────────────────────────────
      # Prepare signing key
      # ─────────────────────────────────────────────────────────────
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

          chmod 600 signing.keystore

          keytool -list \
            -keystore signing.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            >/dev/null

          echo "Keystore verified."

      # ─────────────────────────────────────────────────────────────
      # Sign base APK
      # ─────────────────────────────────────────────────────────────
      - name: Sign base APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          apksigner sign \
            --ks signing.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            rebuilt-base-aligned.apk

      # ─────────────────────────────────────────────────────────────
      # Verify base APK
      # ─────────────────────────────────────────────────────────────
      - name: Verify signed base APK
        run: |
          apksigner verify -v rebuilt-base-aligned.apk

      # ─────────────────────────────────────────────────────────────
      # Create final APKS directory
      # ─────────────────────────────────────────────────────────────
      - name: Prepare final APKS
        run: |
          rm -rf final-apks
          mkdir -p final-apks

          # Copy rebuilt/signed base APK
          cp rebuilt-base-aligned.apk final-apks/base.apk

          # Copy configuration splits unchanged
          find extracted -maxdepth 1 -type f -name "*.apk" \
            -name "*config*" \
            -exec cp {} final-apks/ \;

          echo "Final APKS contents:"
          ls -lh final-apks

      # ─────────────────────────────────────────────────────────────
      # Repackage as .apks
      # ─────────────────────────────────────────────────────────────
      - name: Create APKS archive
        run: |
          rm -f patched.apks

          cd final-apks

          zip -9 -r \
            ../patched.apks \
            *.apk

          cd ..

          echo
          echo "Created:"
          ls -lh patched.apks

      # ─────────────────────────────────────────────────────────────
      # Validate APKS archive
      # ─────────────────────────────────────────────────────────────
      - name: Validate final APKS
        run: |
          echo "Archive contents:"
          unzip -l patched.apks

          echo
          echo "APK files:"
          unzip -Z1 patched.apks | grep '\.apk$'

          APK_COUNT=$(unzip -Z1 patched.apks | grep -c '\.apk$')

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Final APKS contains no APK files."
            exit 1
          fi

          echo
          echo "Final APKS contains $APK_COUNT APK files."

      # ─────────────────────────────────────────────────────────────
      # Upload artifact
      # ─────────────────────────────────────────────────────────────
      - name: Upload patched APKS
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: patched.apks
          if-no-files-found: error
          retention-days: 7

      # ─────────────────────────────────────────────────────────────
      # Upload individual APKs as optional artifact
      # ─────────────────────────────────────────────────────────────
      - name: Upload individual APKs
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk-splits
          path: final-apks/*.apk
          if-no-files-found: error
          retention-days: 7
